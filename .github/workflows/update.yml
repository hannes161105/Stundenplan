name: Stundenplan aktualisieren

on:
  schedule:
    # 02:00 UTC = 03:00 Uhr deutscher Winterzeit (04:00 Uhr in der Sommerzeit)
    - cron: "0 2 * * *"
  workflow_dispatch:   # zusätzlich per Knopfdruck im Reiter "Actions" startbar

permissions:
  contents: write

concurrency:
  group: stundenplan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Originalplan laden und Seite bauen
        run: python build.py --out index.html

      - name: Neue Seite speichern
        run: |
          if git diff --quiet -- index.html; then
            echo "Keine Änderung."
          else
            git config user.name "stundenplan-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Stundenplan aktualisiert"
            git push
          fi
