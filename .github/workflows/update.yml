name: Stundenplan aktualisieren

on:
  schedule:
    # GitHub verschiebt oder überspringt Läufe zu "runden" Zeiten (z. B. 02:00) oft ganz.
    # Darum drei Versuche zu ungeraden Minuten. Wer zuerst läuft, speichert die Änderung,
    # die späteren Läufe finden dann nichts Neues und tun nichts.
    # 01:23 UTC = 03:23 Uhr Sommerzeit / 02:23 Uhr Winterzeit
    - cron: "23 1 * * *"
    - cron: "23 2 * * *"
    - cron: "23 3 * * *"
  workflow_dispatch:   # zusätzlich per Knopfdruck im Reiter "Actions" startbar

permissions:
  contents: write

concurrency:
  group: stundenplan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Originalplan laden und Seite bauen
        run: python build.py --out index.html

      - name: Neue Seite speichern
        run: |
          # Nur die Uhrzeit des Bauens zu ändern reicht nicht für einen neuen Stand.
          if git diff --quiet -I'Diese Seite wurde am' -- index.html; then
            echo "Keine Änderung im Plan."
          else
            git config user.name "stundenplan-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Stundenplan aktualisiert"
            git push
          fi
